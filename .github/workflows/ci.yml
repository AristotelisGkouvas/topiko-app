name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pamesentra
          POSTGRES_PASSWORD: pamesentra
          POSTGRES_DB: pamesentra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pamesentra"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://pamesentra:pamesentra@127.0.0.1:5432/pamesentra
      TEST_DATABASE_URL: postgresql+asyncpg://pamesentra:pamesentra@127.0.0.1:5432/pamesentra_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: mypy
      # The migrations, from empty, must end where the models are.
      - run: alembic upgrade head && alembic check
      - run: PGPASSWORD=pamesentra psql -h 127.0.0.1 -U pamesentra -c "CREATE DATABASE pamesentra_test"
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  # The frontend's types are generated from the API's OpenAPI document. This
  # regenerates them and fails if the committed copy differs — a backend field
  # renamed without `npm run types` is caught here, not on a page.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npm run types
        working-directory: frontend
      - run: git diff --exit-code -- frontend/src/lib/api-schema.ts

  # The built site against a seeded API, in a real browser: every page loads,
  # has a heading, no duplicate ids and no console errors.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pamesentra
          POSTGRES_PASSWORD: pamesentra
          POSTGRES_DB: pamesentra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pamesentra"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://pamesentra:pamesentra@127.0.0.1:5432/pamesentra
      CORS_ORIGINS: http://127.0.0.1:3000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      API_INTERNAL_URL: http://127.0.0.1:8000
      E2E_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements.txt
        working-directory: backend
      - run: alembic upgrade head && python -m scripts.seed
        working-directory: backend
      - run: python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
        working-directory: backend
      - run: npm ci && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: |
          # Run as production does: the standalone server, with its static
          # files beside it (next start does not serve a standalone build).
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          PORT=3000 HOSTNAME=127.0.0.1 node .next/standalone/server.js &
          npx wait-on -t 60000 http://127.0.0.1:3000 http://127.0.0.1:8000/health
          npm run e2e
        working-directory: frontend
