services:
  db:
    image: postgres:16-alpine
    container_name: pamesentra-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pamesentra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pamesentra}
      POSTGRES_DB: pamesentra
      # Greek-aware collation, so ORDER BY on team names follows the Greek
      # alphabet. Must go through ICU: the alpine image is musl-based and
      # silently degrades a glibc locale like el_GR.UTF-8 to byte order,
      # which sorts accented capitals (Ή) before unaccented ones (Ζ).
      POSTGRES_INITDB_ARGS: >-
        --encoding=UTF8 --locale-provider=icu --icu-locale=el-GR --locale=C
    ports:
      # Loopback by default. A database reachable from the internet is a
      # database somebody else will find, and nothing outside this compose
      # network needs it.
      - "${DB_PORT:-127.0.0.1:5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pamesentra -d pamesentra"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Migrations as a service of their own, so the API does not race the
  # scheduler to apply them. Runs to completion, then everything else starts.
  migrate:
    build: ./backend
    image: pamesentra-backend
    container_name: pamesentra-migrate
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://pamesentra:pamesentra@db:5432/pamesentra}
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: ./backend
    image: pamesentra-backend
    container_name: pamesentra-api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://pamesentra:pamesentra@db:5432/pamesentra}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      DEBUG: ${DEBUG:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # Which proxies uvicorn believes about X-Forwarded-For. The rate limits
      # and the audit trail key on the address it resolves; behind a proxy
      # that it does not trust, every visitor is the proxy.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      # Without this the container falls back to the placeholder in config.py
      # and refuses to boot outside development — which is the guard working,
      # but only because it was there.
      SECRET_KEY: ${SECRET_KEY:-}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-720}
      # True once there is HTTPS in front. A secure cookie over plain http is
      # dropped by the browser and the dashboard silently never logs in.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # Club logos, gallery photos, sponsor logos. On a volume so rebuilding
      # the image does not delete them; back it up with the database.
      MEDIA_DIR: /data/media
    volumes:
      - media:/data/media
    ports:
      # Configurable because a server rarely has 8000 free — and behind a
      # reverse proxy this should not be public at all.
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health').read()"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  scraper:
    build: ./backend
    image: pamesentra-backend
    container_name: pamesentra-scraper
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://pamesentra:pamesentra@db:5432/pamesentra}
      # Names the project and carries a real way to reach a human. A federation
      # webmaster who wants this stopped should not have to guess who is asking.
      SCRAPER_USER_AGENT: ${SCRAPER_USER_AGENT:?βάλε πραγματικό email στο SCRAPER_USER_AGENT πριν τρέξει σε ζωντανό site}
      SCRAPER_LIVE_INTERVAL_SECONDS: ${SCRAPER_LIVE_INTERVAL_SECONDS:-300}
      SCRAPER_IDLE_INTERVAL_SECONDS: ${SCRAPER_IDLE_INTERVAL_SECONDS:-21600}
    command: ["python", "-m", "app.scraper.schedule"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    # It sleeps between cycles and wakes on the signal, so the default grace
    # period is more than enough for the run in flight.
    stop_grace_period: 30s

  web:
    build:
      context: ./frontend
      args:
        # Build args, not environment: Next inlines every NEXT_PUBLIC_ value
        # into the client bundle at build time. This must be the address the
        # *reader's browser* resolves, never the compose hostname.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:8000}
        NEXT_PUBLIC_ASSOCIATION: ${NEXT_PUBLIC_ASSOCIATION:-epsip-ipeirou}
        # Same reason: baked in, because og:image URLs are absolute and are
        # rendered into the HTML at build time.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-}
    image: pamesentra-frontend
    container_name: pamesentra-web
    restart: unless-stopped
    environment:
      # Read at request time, and only by the server half: page rendering stays
      # on the compose network instead of leaving the host and coming back.
      API_INTERNAL_URL: http://api:8000
      # host=slug pairs, for serving more than one ΕΠΣ from one deployment.
      # Empty: every host is NEXT_PUBLIC_ASSOCIATION. See src/lib/tenant.ts.
      ASSOCIATION_HOSTS: ${ASSOCIATION_HOSTS:-}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  media:
