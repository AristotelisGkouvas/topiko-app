[pytest]
testpaths = tests
# Bare `async def` tests are collected and then skipped without a mode set —
# a green run that proved nothing. Explicit markers, so an async test that is
# not marked fails loudly instead.
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
filterwarnings =
    # The integration tests pass a session cookie per request on purpose, to
    # act as several people from one client.
    ignore:Setting per-request cookies:DeprecationWarning
